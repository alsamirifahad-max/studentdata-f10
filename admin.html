<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة مسؤول الدعم | ثانوية بلاط الشهداء</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="wrap head"><div class="seal">ب</div><div><h1>لوحة مسؤول الدعم الفني</h1><p class="sub">ثانوية بلاط الشهداء الثانوية</p></div><a class="adminlink" href="/">العودة للموقع</a></div></header><main class="wrap"><section class="section"><h2>دخول المسؤول المخوّل</h2><p class="muted">تسجيل الدخول متاح لحسابات المسؤولين التي أُضيف بريدها إلى قائمة الإدارة في إعدادات الخادم.</p><div id="loginPanel" class="panel"><form id="loginForm"><div class="form-grid"><label>البريد الإلكتروني<input type="email" name="email" required autocomplete="username"></label><label>كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label></div><button class="btn">تسجيل الدخول</button><p id="loginMsg" class="message" role="status"></p></form></div><div id="dash" class="hidden"><div class="panel"><div class="section-head"><h2>طلبات الدعم</h2><button id="refresh" class="btn secondary" type="button">تحديث القائمة</button></div><p id="dashMsg" class="message" role="status"></p><div id="tickets"></div><button id="logout" class="btn secondary" type="button">تسجيل الخروج</button></div></div></section></main><script src="/admin.js" defer></script></body></html>
